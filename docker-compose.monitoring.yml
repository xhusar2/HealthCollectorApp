# Run on homelab (or wherever Grafana should live). InfluxDB + Grafana + ETL.
# First run: set INFLUX_TOKEN; set MONGO_URI so ETL can reach Mongo (e.g. mongodb://user:pass@host.docker.internal:27017/?authSource=admin).
# Create dirs: monitoring/influxdb-data, monitoring/grafana-data

services:
  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - ./monitoring/influxdb-data:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:-changeme}
      DOCKER_INFLUXDB_INIT_ORG: family
      DOCKER_INFLUXDB_INIT_BUCKET: health
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-my-super-secret-auth-token}

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./monitoring/grafana-data:/var/lib/grafana

  etl:
    build: ./etl
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Mongo on homelab (same host: use host.docker.internal; or use db:27017 if Mongo is in same compose)
      MONGO_URI: ${MONGO_URI}

      # InfluxDB (same compose)
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: family
      INFLUX_BUCKET: health

      ETL_INTERVAL: ${ETL_INTERVAL:-900}
    # When Mongo runs in another compose on same host: MONGO_URI=mongodb://user:pass@host.docker.internal:27017/?authSource=admin